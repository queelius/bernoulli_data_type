site_name: Bernoulli Data Type
site_description: A framework for understanding and constructing probabilistic data structures with controlled error rates
site_author: Your Name
repo_url: https://github.com/oblivious-computing/bernoulli_data_type
repo_name: bernoulli_data_type

theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - content.tabs.link
    - content.code.annotation
    - content.code.copy

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.arithmatex:
      generic: true
  - footnotes
  - pymdownx.details
  - pymdownx.mark
  - attr_list
  - md_in_html

extra_javascript:
  - javascripts/mathjax.js
  - https://polyfill.io/v3/polyfill.min.js?features=es6
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

nav:
  - Home: index.md
  - Theory:
      - Overview: theory/bernoulli-model.md
      - Bernoulli Boolean: theory/bernoulli-bool.md
      - Bernoulli Set: theory/bernoulli-set.md
      - Bernoulli Map: theory/bernoulli-map.md
      - Bernoulli Tuple: theory/bernoulli-tuple.md
      - Bernoulli Unit: theory/bernoulli-unit.md
      - Bernoulli Void: theory/bernoulli-void.md
  - Implementation:
      - Codecs: implementation/codec.md
      - Regular Types: implementation/regular-types.md
  - API Reference:
      - C++ API: api/html/index.html
